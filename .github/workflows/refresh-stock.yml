name: Refresh stock (heavy)

# 재고 탭 원천 독립 갱신 — 통합 원장 재고 피벗 3종(inventory_*, 매시) + 매장 이동(store_moves, SCM-HUB).
# ⚠️ 무거워서 야간 full(refresh.yml)·시간별 판매와 분리. _DECOUPLED 라 daily --snapshots 에서는 제외 → 여기서만 갱신.
# 흐름: _meta.json 내려받기 → refresh.py --stock (parquet 재생성) → GCS 업로드 → 슬랙(실패시).
# 트리거: 스케줄(하루 3회, 영업시간대) + 재고 REFRESH 버튼(workflow_dispatch).

on:
  schedule:
    - cron: "0 1,7,13 * * *"    # 10:00 / 16:00 / 22:00 KST (영업시간 중 위탁 입고확정 반영)
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: data-refresh          # full/hourly/ips와 동일 그룹 → 동시 실행 방지(공유 웨어하우스 경합·파일 충돌 방지)
  cancel-in-progress: false

jobs:
  refresh-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 60        # scm_hub 뷰가 느려 넉넉히(상한일 뿐)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Download _meta.json (freshness merge)
        run: |
          mkdir -p cache
          B="gs://${{ vars.GCS_CACHE_BUCKET }}"
          gcloud storage cp "$B/_meta.json" ./cache/ || true

      - name: Run stock refresh (inventory_* · store_moves)
        env:
          WAREHOUSE_CACHE: ${{ github.workspace }}/cache
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBX_CLOUD_FETCH: "1"          # 프록시 없는 러너 → CloudFetch로 대용량 페치 가속(무거운 뷰)
        run: python refresh.py --stock

      - name: Upload stock cache to GCS
        run: |
          B="gs://${{ vars.GCS_CACHE_BUCKET }}"
          # 있을 때만 업로드(빌드 실패해도 core 캐시는 안 건드림).
          #   생성물: inventory_pivot · inventory_goods · inventory_store_long · store_moves.
          for f in inventory_pivot inventory_goods inventory_store_long store_moves; do
            if [ -f "./cache/$f.parquet" ]; then gcloud storage cp "./cache/$f.parquet" "$B/"; fi
          done
          gcloud storage cp ./cache/_meta.json "$B/" || true

      - name: Slack notify — 실패 시에만
        if: failure()
        run: |
          curl -s -X POST -H 'Content-type: application/json' "${{ secrets.SLACK_WEBHOOK_URL }}" -d @- <<EOF
          {"text":":x: 무신사 대시보드 *재고(위탁 실시간) 갱신 실패* — <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그 확인>"}
          EOF
