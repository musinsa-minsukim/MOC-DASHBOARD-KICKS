name: Deploy to Cloud Run

# 무신사 오프라인 대시보드 자동배포 (기존 라이브 서비스 musinsa-dashboard).
# - 트리거: main 브랜치 push (또는 수동 실행).
# - 인증: Workload Identity Federation (장기 키 파일 없음).
# - 배포: `gcloud run deploy --source .` → Cloud Build가 Dockerfile로 빌드.
#   기존 서비스 설정(메모리 4Gi/CPU1/min0·max1·시크릿·GCS볼륨)은 그대로 보존 → scale-to-zero 무료 유지.
# - ⚠️ 데이터 갱신(mode=full, 8Gi 필요)은 이 파이프라인과 무관 — Scheduler/수동으로 별도 수행.
# 최초 1회 설정: GITHUB-SETUP.md 참조.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write          # WIF OIDC 토큰 발급

concurrency:
  group: deploy-prod
  cancel-in-progress: false  # 배포 중복 방지(진행 중이면 대기)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --source . \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format="value(status.url)"
