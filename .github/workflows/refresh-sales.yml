name: Refresh sales (hourly)

# 가벼운 "매시 판매 갱신"(판매·영수증 증분만)을 GitHub Actions 16GB 러너에서 실행 — 시간대별 매출·객단가 최신화.
# full(재고·상품·고객·국가별)은 별도 워크플로(refresh.yml, 매일 07:00). 여기선 sales+receipts만.
# ⏱️ 정시성: GitHub schedule cron은 큐 지연·스킵으로 부정확 → 제거함. 대신 Cloud Scheduler(mok-refresh-sales-gh,
#    tz Asia/Seoul "25 11-23")가 매시 :25에 이 워크플로를 workflow_dispatch로 트리거(이벤트 즉시 실행 = 정시).
#    → 정시성(Scheduler) + 견고함(GitHub 16GB, Cloud Run 4Gi OOM 무관) 둘 다 확보. 수동 실행도 아래 dispatch로.
# 성능: 전체 캐시 대신 sales/receipts/_meta 3개 파일만 동기화 → 빠르고 Actions 분 절약.

on:
  workflow_dispatch: {}      # Cloud Scheduler(:25)가 GitHub API로 dispatch + 수동 실행. (schedule cron은 부정확해 제거)

permissions:
  contents: read
  id-token: write

concurrency:
  group: data-refresh          # refresh.yml(full)과 같은 그룹 → 동시 실행 방지(파일 충돌 방지)
  cancel-in-progress: false

jobs:
  refresh-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Download sales/receipts/sales_option cache only
        run: |
          mkdir -p cache
          B="gs://${{ vars.GCS_CACHE_BUCKET }}"
          gcloud storage cp "$B/sales.parquet" "$B/receipts.parquet" "$B/sales_option.parquet" "$B/_meta.json" ./cache/ || true

      - name: Run sales refresh (증분)
        env:
          WAREHOUSE_CACHE: ${{ github.workspace }}/cache
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBX_CLOUD_FETCH: "1"          # 프록시 없는 러너 → CloudFetch로 대용량 페치 가속(Thrift 행단위 수신 회피)
        run: python refresh.py --window=7   # 시간별: 최근 7일만 재적재(스캔·페치 ~6배↓). 45일 전체 보정은 일일 full이 담당

      - name: Upload cache (core 필수 + sales_option 선택)
        run: |
          B="gs://${{ vars.GCS_CACHE_BUCKET }}"
          # core(판매/영수증/메타)는 반드시 업로드 — sales_option 유무와 무관하게 대시보드 최신 유지.
          gcloud storage cp ./cache/sales.parquet ./cache/receipts.parquet ./cache/_meta.json "$B/"
          # sales_option(부가 CSV 캐시)은 있을 때만 — 없다고 core 업로드가 막히면 안 됨.
          if [ -f ./cache/sales_option.parquet ]; then gcloud storage cp ./cache/sales_option.parquet "$B/"; else echo "sales_option.parquet 없음 — 건너뜀"; fi

      - name: Slack notify — 실패 시에만
        if: failure()
        run: |
          curl -s -X POST -H 'Content-type: application/json' "${{ secrets.SLACK_WEBHOOK_URL }}" -d @- <<EOF
          {"text":":x: 무신사 대시보드 *매시 판매 갱신 실패* — <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그 확인>"}
          EOF
