[project]
name = "musinsa-offline-dashboard"
version = "0.1.0"
description = "무신사 오프라인 매장 대시보드 (Streamlit + DuckDB)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit==1.58.0",
    "databricks-sql-connector==4.3.0",
    "pandas==3.0.3",
    "plotly==6.8.0",
    "truststore==0.10.4",
    "duckdb==1.5.4",
    "streamlit-authenticator==0.4.2",
    "PyYAML==6.0.3",
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.49.0",
]

[tool.uv]
package = false
